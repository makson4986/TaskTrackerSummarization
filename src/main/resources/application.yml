spring:
  application:
    name: TaskTrackerSummarization
  main:
    web-application-type: none
  kafka:
    bootstrap-servers: ${KAFKA_BROKER_URL}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        spring.json.type.mapping: report:org.makson.tasktrackersummarization.dto.ReportDto
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      group-id: summarizationServiceGroup
      properties:
        spring.json.type.mapping: user_tasks:org.makson.tasktrackersummarization.dto.UserTasksDto
    topics:
      summarization-requests: ${KAFKA_SUMMARIZATION_REQUESTS_TOPIC}
llm:
  model: ${LLM_MODEL}
  auth-url: ${LLM_AUTH_URL}
  api-url: ${LLM_API_URL}
  authorization-key: ${LLM_AUTHORIZATION_KEY}